name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate lessons
        run: node scripts/validate.mjs
      - name: Check index freshness
        run: node scripts/build-index.mjs --check
      - name: Build content and verify shape
        run: |
          node scripts/build-content.mjs
          node -e "const c=require('./dist/content.json');const i=require('./index.json');if(c.schema_version!==1||c.count!==i.count||c.lessons.length!==i.lessons.length){console.error('content.json 与 index.json 不一致');process.exit(1)}"

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Install server deps
        run: pnpm --dir server install --frozen-lockfile
      - name: Build and test server
        run: pnpm --dir server test
      - name: Build docker image
        run: docker build -t ai-coding-lessons-mcp:ci ./server
