name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate lessons
        run: node scripts/validate.mjs
      - name: Check index freshness
        run: node scripts/build-index.mjs --check
