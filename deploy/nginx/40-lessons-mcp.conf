# lessons.e-top.online — ai-coding-lessons MCP 服务（Streamable HTTP）
# 反代到同一 Docker 网络（yzy-net）内的 ai-coding-lessons-mcp 容器，不经过宿主端口。
# 部署：把本文件复制为 yzy 仓库的 yzy-h5/conf.d/40-lessons-mcp.conf，走 yzy 发布流程。
# 通配符证书 *.e-top.online 已覆盖本子域名，无需重签。

server {
    listen 80;
    server_name lessons.e-top.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lessons.e-top.online;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker 内置 DNS：容器重建后 IP 变化，10s 内重新解析，避免 upstream 解析被缓存到 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mcp_upstream ai-coding-lessons-mcp;

    location / {
        proxy_pass http://$mcp_upstream:8321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # MCP 可能使用 SSE 流式响应：关缓冲、放宽读超时
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
