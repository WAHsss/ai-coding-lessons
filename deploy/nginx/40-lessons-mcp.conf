# lessons.e-top.online — ai-coding-lessons MCP 服务（Streamable HTTP）
# 反代到宿主机 Node 服务（systemd: ai-coding-lessons-mcp.service，监听 127.0.0.1:8321）
#
# 前置：nginx 跑在 yzy-nginx 容器里，127.0.0.1 指向容器自身，访问宿主机服务需要
# 在 docker-compose 的 nginx 服务中加：
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
# 通配符证书 *.e-top.online 已覆盖本子域名，无需重签。

server {
    listen 80;
    server_name lessons.e-top.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name lessons.e-top.online;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://host.docker.internal:8321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # MCP 可能使用 SSE 流式响应，关缓冲、放宽读超时
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
